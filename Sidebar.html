<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font: 14px/1.45 "Google Sans", Roboto, Arial, sans-serif; color: #202124; margin: 16px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: #5f6368; }
    button { width: 100%; padding: 9px; margin-top: 8px; border: 0; border-radius: 4px;
      font: inherit; font-weight: 500; cursor: pointer; background: #673ab7; color: #fff; }
    button.secondary { background: transparent; color: #673ab7; border: 1px solid #dadce0; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid #673ab7; outline-offset: 2px; }
    .status { padding: 10px; border-radius: 4px; background: #f1f3f4; margin-bottom: 8px; }
    .status.on { background: #e6f4ea; }
    .hint { font-size: 12px; color: #5f6368; margin-top: 8px; }
    .error { color: #c5221f; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>FormGuard</h2>
  <p>Adds an academic integrity notice, a required integrity pledge, and a reminder on every question.</p>

  <div id="status" class="status">Loading...</div>

  <button id="protect">Protect form</button>
  <button id="unprotect" class="secondary">Unprotect form</button>
  <div class="hint">Added new questions? Click Unprotect form, then Protect form.</div>

  <div id="error" class="error"></div>

  <script>
    const $ = id => document.getElementById(id);

    function render(s) {
      $('status').className = 'status' + (s.isProtected ? ' on' : '');
      $('status').textContent = s.isProtected ? 'Protected' : 'Not protected';
      $('protect').disabled = s.isProtected;
      $('unprotect').disabled = !s.isProtected;
    }

    function fail(err) {
      $('error').textContent = err.message || err;
      google.script.run.withSuccessHandler(render).getStatus();
    }
    function setBusy(b) { document.querySelectorAll('button').forEach(x => x.disabled = b); }
    function call(fn) {
      $('error').textContent = '';
      setBusy(true);
      google.script.run.withSuccessHandler(render).withFailureHandler(fail)[fn]();
    }

    $('protect').onclick = () => call('protectForm');
    $('unprotect').onclick = () => call('unprotectForm');

    call('getStatus');
  </script>
</body>
</html>
